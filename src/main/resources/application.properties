spring.application.name=Calzado ERP
app.initial-admin.username=${INITIAL_ADMIN_USERNAME:user1}
app.initial-admin.password=${INITIAL_ADMIN_PASSWORD}
app.initial-admin.email=${INITIAL_ADMIN_EMAIL:user1@calzado.local}
app.initial-admin.full-name=${INITIAL_ADMIN_FULL_NAME:Administrador inicial}
app.demo-data.enabled=${DEMO_DATA_ENABLED:false}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/calzado_erp}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.thymeleaf.cache=false
server.port=${PORT:8080}

#---
spring.config.activate.on-profile=h2
spring.datasource.url=jdbc:h2:mem:calzado;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop