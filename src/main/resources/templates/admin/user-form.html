<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${formTitle}">Usuario</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="admin-page"><aside th:replace="~{admin/fragments :: sidebar('users')}"></aside><main class="admin-main"><header class="admin-topbar"><span>Seguridad / <a th:href="@{/admin/usuarios}">Usuarios</a> / <span th:text="${formTitle}">Usuario</span></span><span class="admin-user"><i></i> Administración</span></header><section class="admin-content form-content"><a class="back-link" th:href="@{/admin/usuarios}">← Volver a usuarios</a><div class="admin-title-row"><div><p class="eyebrow">ACCESO Y PERMISOS</p><h1 th:text="${formTitle}">Usuario</h1></div></div><form class="product-form" th:object="${userForm}" th:action="${formAction}" method="post"><div class="form-grid"><label>Nombre completo<input th:field="*{fullName}" maxlength="100" autocomplete="name" required><small class="field-error" th:errors="*{fullName}"></small></label><label>Nombre de usuario<input th:field="*{username}" minlength="3" maxlength="40" autocomplete="username" required><small class="field-error" th:errors="*{username}"></small></label><label>Correo electrónico<input th:field="*{email}" type="email" maxlength="120" autocomplete="email" required><small class="field-error" th:errors="*{email}"></small></label><label>Rol<select th:field="*{role}" required><option th:each="role : ${roles}" th:value="${role}" th:text="${role.label}"></option></select><small class="field-error" th:errors="*{role}"></small></label><label class="form-span">Contraseña <span th:if="${userId != null}">(deja en blanco para conservarla)</span><input th:field="*{password}" type="password" minlength="8" maxlength="72" autocomplete="new-password" th:required="${userId == null}"><small class="field-error" th:errors="*{password}"></small></label></div><div class="form-actions"><a class="button button-quiet" th:href="@{/admin/usuarios}">Cancelar</a><button class="button button-dark" type="submit">Guardar usuario</button></div></form></section></main></body></html>
