<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reclamos | PASO ERP</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="admin-page"><aside th:replace="~{admin/fragments :: sidebar('complaints')}"></aside><main class="admin-main"><header class="admin-topbar"><span>Atención / Reclamos</span><span class="admin-user"><i></i> Administración</span></header><section class="admin-content"><div class="admin-title-row"><div><p class="eyebrow">ATENCIÓN AL CLIENTE</p><h1>Reclamos</h1><p class="page-description">Revisa solicitudes y registra su seguimiento hasta resolverlas.</p></div><a class="button button-quiet" th:href="@{/reclamos/nuevo}">Abrir formulario público ↗</a></div><div class="notice" th:if="${notice}" th:text="${notice}"></div><div class="table-wrap"><table class="data-table"><thead><tr><th>FECHA</th><th>CLIENTE</th><th>CONTACTO</th><th>PEDIDO</th><th>MENSAJE</th><th>ESTADO</th><th></th></tr></thead><tbody><tr th:each="complaint : ${complaints}"><td th:text="${complaint.createdAt}">Fecha</td><td th:text="${complaint.customerName}">Cliente</td><td th:text="${complaint.customerEmail}">Correo</td><td th:text="${complaint.orderNumber != null and !complaint.orderNumber.isBlank() ? complaint.orderNumber : '—'}">—</td><td class="message-cell" th:text="${complaint.message}">Mensaje</td><td><span class="status-pill" th:text="${complaint.status.label}">Abierta</span></td><td><form class="inline-status" th:action="@{/admin/reclamos/{id}/estado(id=${complaint.id})}" method="post"><select name="status" aria-label="Cambiar estado"><option th:each="status : ${statuses}" th:value="${status}" th:text="${status.label}" th:selected="${status == complaint.status}"></option></select><button type="submit">Guardar</button></form></td></tr><tr th:if="${#lists.isEmpty(complaints)}"><td colspan="7"><div class="table-empty"><span>Sin reclamos</span><p>Las solicitudes de los clientes aparecerán aquí.</p></div></td></tr></tbody></table></div></section></main></body></html>
