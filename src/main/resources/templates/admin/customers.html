<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Clientes | PASO ERP</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="admin-page"><aside th:replace="~{admin/fragments :: sidebar('customers')}"></aside><main class="admin-main"><header class="admin-topbar"><span>Relaciones / Clientes</span><span class="admin-user"><i></i> Administración</span></header><section class="admin-content"><div class="admin-title-row"><div><p class="eyebrow">RELACIONES</p><h1>Clientes</h1><p class="page-description">Personas que han realizado pedidos en la tienda.</p></div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>NOMBRE</th><th>CORREO</th><th>TELÉFONO</th><th>DIRECCIÓN DE ENTREGA</th></tr></thead><tbody><tr th:each="customer : ${customers}"><td><strong th:text="${customer.fullName}">Cliente</strong></td><td th:text="${customer.email}">correo</td><td th:text="${customer.phone != null and !customer.phone.isBlank() ? customer.phone : '—'}">—</td><td th:text="${customer.shippingAddress}">Dirección</td></tr><tr th:if="${#lists.isEmpty(customers)}"><td colspan="4"><div class="table-empty"><span>Aún no hay clientes</span><p>Los datos se guardan al confirmar una compra.</p></div></td></tr></tbody></table></div></section></main></body></html>
