<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Usuarios | PASO ERP</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="admin-page"><aside th:replace="~{admin/fragments :: sidebar('users')}"></aside><main class="admin-main"><header class="admin-topbar"><span>Seguridad / Usuarios</span><span class="admin-user"><i></i> Administración</span></header><section class="admin-content"><div class="admin-title-row"><div><p class="eyebrow">ACCESO Y PERMISOS</p><h1>Usuarios</h1><p class="page-description">Crea cuentas de personal y asigna responsabilidades por módulo.</p></div><a class="button button-dark" th:href="@{/admin/usuarios/nuevo}"><span aria-hidden="true">＋</span> Nuevo usuario</a></div><div class="notice" th:if="${notice}" th:text="${notice}"></div><div class="notice notice-error" th:if="${error}" th:text="${error}"></div><div class="table-wrap"><table class="data-table"><thead><tr><th>PERSONA</th><th>USUARIO</th><th>CORREO</th><th>ROL</th><th>ESTADO</th><th></th></tr></thead><tbody><tr th:each="user : ${users}"><td><strong th:text="${user.fullName}">Persona</strong></td><td th:text="${user.username}">usuario</td><td th:text="${user.email}">correo</td><td><span class="role-tag" th:text="${user.role.label}">Ventas</span></td><td><span class="status-pill" th:classappend="${user.enabled ? ' is-active' : ' is-inactive'}" th:text="${user.enabled ? 'Activo' : 'Inactivo'}">Activo</span></td><td class="row-actions"><a class="icon-action" th:href="@{/admin/usuarios/{id}/editar(id=${user.id})}">Editar</a><form th:if="${user.enabled}" th:action="@{/admin/usuarios/{id}/desactivar(id=${user.id})}" method="post"><button class="text-action" type="submit">Desactivar</button></form></td></tr><tr th:if="${#lists.isEmpty(users)}"><td colspan="6"><div class="table-empty"><span>Sin cuentas de personal</span><p>Crea usuarios para asignar acceso al equipo.</p></div></td></tr></tbody></table></div></section></main></body></html>
