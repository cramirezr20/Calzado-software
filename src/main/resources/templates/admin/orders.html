<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pedidos | PASO ERP</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="admin-page"><aside th:replace="~{admin/fragments :: sidebar('orders')}"></aside><main class="admin-main"><header class="admin-topbar"><span>Ventas / Pedidos</span><span class="admin-user"><i></i> Administración</span></header><section class="admin-content"><div class="admin-title-row"><div><p class="eyebrow">VENTAS Y ENTREGA</p><h1>Pedidos</h1><p class="page-description">Actualiza el avance de cada compra. Cancelar un pedido devuelve sus pares al inventario.</p></div></div><div class="notice" th:if="${notice}" th:text="${notice}"></div><div class="notice notice-error" th:if="${error}" th:text="${error}"></div><div class="table-wrap"><table class="data-table"><thead><tr><th>PEDIDO</th><th>FECHA</th><th>CLIENTE</th><th>CONTACTO</th><th>TOTAL</th><th>ESTADO</th><th></th></tr></thead><tbody><tr th:each="order : ${orders}"><td><strong th:text="${order.orderNumber}">PASO-000</strong></td><td th:text="${order.createdAt}">Fecha</td><td th:text="${order.customer.fullName}">Cliente</td><td th:text="${order.customer.email}">Correo</td><td th:text="|Q ${#numbers.formatDecimal(order.total, 1, 'COMMA', 2, 'POINT')}|">Q 0.00</td><td><span class="status-pill" th:classappend="${' status-' + #strings.toLowerCase(order.status.name())}" th:text="${order.status.label}">Recibido</span></td><td><form class="inline-status" th:action="@{/admin/pedidos/{id}/estado(id=${order.id})}" method="post"><select name="status" aria-label="Cambiar estado" th:disabled="${order.status.name() == 'CANCELLED'}"><option th:each="status : ${statuses}" th:value="${status}" th:text="${status.label}" th:selected="${status == order.status}"></option></select><button type="submit" th:disabled="${order.status.name() == 'CANCELLED'}">Guardar</button></form></td></tr><tr th:if="${#lists.isEmpty(orders)}"><td colspan="7"><div class="table-empty"><span>Aún no hay pedidos</span><p>Los pedidos de la tienda aparecerán aquí.</p></div></td></tr></tbody></table></div></section></main></body></html>
