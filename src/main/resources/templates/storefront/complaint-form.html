<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ayuda | PASO</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="store-page"><header class="store-header"><a class="wordmark" th:href="@{/tienda}"><span class="wordmark-mark">P</span><span>PASO<br><small>CALZADO</small></span></a><nav class="store-nav"><a th:href="@{/tienda}">Tienda</a><a th:href="@{/carrito}">Bolsa</a></nav></header><main class="checkout-shell form-content"><a class="back-link" th:href="@{/tienda}">← Volver a la tienda</a><p class="eyebrow">ESTAMOS PARA AYUDARTE</p><h1>Cuéntanos qué pasó.</h1><div class="notice" th:if="${notice}" th:text="${notice}"></div><form class="checkout-form" th:object="${complaintForm}" th:action="@{/reclamos}" method="post"><label>Nombre completo<input th:field="*{customerName}" maxlength="120" required><small class="field-error" th:errors="*{customerName}"></small></label><label>Correo electrónico<input th:field="*{customerEmail}" type="email" maxlength="120" required><small class="field-error" th:errors="*{customerEmail}"></small></label><label>Número de pedido (opcional)<input th:field="*{orderNumber}" maxlength="24" placeholder="PASO-…"><small class="field-error" th:errors="*{orderNumber}"></small></label><label>Mensaje<textarea th:field="*{message}" maxlength="2000" rows="5" required></textarea><small class="field-error" th:errors="*{message}"></small></label><button class="button button-dark" type="submit">Enviar solicitud</button></form></main><footer class="store-footer"><span>PASO · CALZADO</span><span>Ciudad de Guatemala</span></footer></body></html>
