<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checkout | PASO</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="store-page"><header class="store-header"><a class="wordmark" th:href="@{/tienda}"><span class="wordmark-mark">P</span><span>PASO<br><small>CALZADO</small></span></a><nav class="store-nav"><a th:href="@{/carrito}">Volver a la bolsa</a><a th:href="@{/reclamos/nuevo}">Ayuda</a></nav></header>
<main class="checkout-shell"><a class="back-link" th:href="@{/carrito}">← Tu bolsa</a><p class="eyebrow">ÚLTIMO PASO</p><h1>Datos de entrega</h1><div class="checkout-layout"><form class="checkout-form" th:object="${checkoutForm}" th:action="@{/checkout}" method="post"><div class="global-errors" th:if="${#fields.hasGlobalErrors()}"><p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p></div><label>Nombre completo<input th:field="*{fullName}" autocomplete="name" maxlength="120" required><small class="field-error" th:errors="*{fullName}"></small></label><label>Correo electrónico<input th:field="*{email}" type="email" autocomplete="email" maxlength="120" required><small class="field-error" th:errors="*{email}"></small></label><label>Teléfono<input th:field="*{phone}" type="tel" autocomplete="tel" maxlength="30" placeholder="Opcional"><small class="field-error" th:errors="*{phone}"></small></label><label>Dirección de entrega<textarea th:field="*{shippingAddress}" autocomplete="street-address" maxlength="300" rows="3" required></textarea><small class="field-error" th:errors="*{shippingAddress}"></small></label><button class="button button-dark" type="submit">Confirmar pedido</button><p class="summary-note">El pedido se registra como recibido; el pago se coordina fuera de la tienda.</p></form><aside class="cart-summary"><p class="eyebrow">TU PEDIDO</p><div class="checkout-items"><p th:each="line : ${cartLines}"><span th:text="|${line.quantity} × ${line.product.name}|">Producto</span><strong th:text="|Q ${#numbers.formatDecimal(line.subtotal, 1, 'COMMA', 2, 'POINT')}|">Q 0.00</strong></p></div><div class="summary-total"><span>Total</span><strong th:text="|Q ${#numbers.formatDecimal(cartTotal, 1, 'COMMA', 2, 'POINT')}|">Q 0.00</strong></div></aside></div></main><footer class="store-footer"><span>PASO · CALZADO</span><a th:href="@{/reclamos/nuevo}">Ayuda y reclamos</a><span>Ciudad de Guatemala</span></footer></body></html>
